<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Transcript" />
<title>Live Transcript</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <h1>Live Transcript</h1>
    </div>
    <div class="status" id="statusText">Ready</div>
    <div class="topbar-actions">
      <button id="copyBtn" class="ghost" title="Copy transcript">Copy</button>
      <button id="downloadBtn" class="ghost" title="Download .txt">Save</button>
      <button id="clearBtn" class="ghost danger" title="Clear transcript">Clear</button>
    </div>
  </header>

  <main id="transcript" class="transcript" aria-live="polite">
    <p class="empty" id="emptyHint">Tap <strong>Start</strong> and begin talking. Text appears here as people speak.</p>
    <div id="segments"></div>
    <p id="interim" class="interim"></p>
  </main>

  <div id="banner" class="banner" hidden></div>

  <footer class="controls">
    <div class="row">
      <span class="row-label">Level</span>
      <div class="meter" id="meter" role="meter" aria-label="Input level" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60">
        <div id="meterFill" class="meter-fill"></div>
        <div id="meterPeak" class="meter-peak"></div>
      </div>
      <span id="meterDb" class="row-value">&minus;&infin; dB</span>
    </div>
    <div class="row">
      <label for="gain" class="row-label">Sensitivity</label>
      <input type="range" id="gain" min="-20" max="20" step="1" value="0" aria-label="Input sensitivity in decibels" />
      <span id="gainValue" class="row-value">0 dB</span>
    </div>
    <div class="buttons">
      <button id="startBtn" class="primary">Start</button>
      <button id="stopBtn" class="secondary" hidden>Stop</button>
    </div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
